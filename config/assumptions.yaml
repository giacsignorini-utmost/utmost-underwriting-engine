# Utmost Underwriting Engine: illustrative assumptions
# Every number in this file is an explicit, editable assumption.
# None of it is taken from a proprietary rating manual or reinsurer basis.

mortality:
  # Gompertz-Makeham force of mortality: mu(x) = A + B * c^x
  male:   {A: 0.00020, B: 0.0000100, c: 1.105}
  female: {A: 0.00015, B: 0.0000055, c: 1.105}
  unisex_male_weight: 0.70        # gender mix used in EU unisex mode (Test-Achats)
  smoker_factor: 1.90             # smoker mortality vs non-smoker
  hnw_factor: 0.85                # lighter mortality of high-net-worth insured lives
  select_factors: [0.60, 0.70, 0.80, 0.90, 0.95]  # policy years 1..5, then 1.00
  max_q: 1.0

product:
  min_entry_age: 18
  max_entry_age: 75
  max_expiry_age: 85
  min_term: 5
  max_term: 30
  max_sum_assured: 20000000

pricing:
  interest_rate: 0.025
  lapse_rates: [0.04, 0.03, 0.02]   # years 1..3, last value applies afterwards
  initial_expense: 2500             # per policy, EUR
  renewal_expense: 400              # per policy per year, EUR
  expense_inflation: 0.02
  initial_commission: 0.40          # % of first-year premium
  renewal_commission: 0.05          # % of renewal premiums
  single_premium_commission: 0.04   # % of single premium
  profit_margin: 0.10               # % of premium (PV)

reinsurance:
  retention: 1000000
  surplus_lines: 9                  # automatic capacity = retention * (1 + lines)
  treaty_rate_pct: 1.10             # YRT rates as % of the company best estimate basis
  treaty_first_year_allowance: 0.50 # % of first-year YRT premium returned
  treaty_renewal_allowance: 0.00
  facultative_pool:
    - {name: "Reinsurer Alpha", rating: "AA-", share: 0.40, rate_pct: 1.15}
    - {name: "Reinsurer Beta",  rating: "AA",  share: 0.35, rate_pct: 1.20}
    - {name: "Reinsurer Gamma", rating: "A+",  share: 0.25, rate_pct: 1.30}
  brokerage: 0.10                   # % of facultative premium, borne by the cedant
  concentration_alert: 0.50         # alert if one facultative reinsurer takes > 50% of the facultative layer

capital:
  mortality_shock: 0.15             # Solvency II standard formula, permanent +15%
  cat_shock: 0.0015                 # +1.5 per mille absolute, next 12 months
  corr_mort_cat: 0.25
  cost_of_capital: 0.10             # shareholder hurdle used to value capital relief

simulation:
  n_sims: 10000
  portfolio_size: 50
  mortality_level_sigma: 0.15       # lognormal uncertainty on the mortality level
  seed: 2026
